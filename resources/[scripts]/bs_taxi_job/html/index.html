<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Tablet</title>
  <style>
    :root {
      --primary: #ffcc00;
      --secondary: #f7d84b;
      --dark: #121212;
      --text: #1b1b1b;
      --light: #fffef5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      display: none;
    }

    #tablet {
      position: absolute;
      right: 3vw;
      top: 10vh;
      width: 520px;
      max-height: 78vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      border: 4px solid var(--dark);
      background: linear-gradient(130deg, var(--primary), var(--secondary));
      color: var(--text);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }

    .header {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 { margin: 0; font-size: 20px; }
    .header .top-right { display: flex; gap: 8px; }

    .actions {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(255,255,255,.2);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--dark);
      color: var(--light);
      cursor: pointer;
      font-weight: bold;
    }

    button.secondary {
      background: #2f2f2f;
    }

    button.danger {
      background: #c62828;
    }

    /* Modal Profile */
    #profileModal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      color: #fff;
      padding: 30px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      background: var(--dark);
      padding: 20px;
      border-radius: 15px;
      width: 80%;
      border: 2px solid var(--primary);
    }

    .profile-card h3 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #444; padding-bottom: 10px; }
    .profile-item { margin: 10px 0; display: flex; justify-content: space-between; font-size: 15px; }
    .profile-item span:first-child { color: #aaa; }

    .list {
      padding: 12px 16px;
      overflow-y: auto;
      display: grid;
      gap: 10px;
    }

    .card {
      background: rgba(255,255,255,.75);
      border: 2px solid rgba(0,0,0,.2);
      border-radius: 12px;
      padding: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .plate { font-size: 18px; font-weight: 800; }
    .muted { opacity: .75; font-size: 13px; }

    .footer {
      padding: 8px 16px 14px;
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <section id="tablet">
    <div class="header">
      <h2>📒 Tablette Garage Taxi</h2>
      <div class="top-right">
        <button class="danger" onclick="logout()">Déconnexion</button>
        <button class="secondary" onclick="closeTablet()">Fermer</button>
      </div>
    </div>

    <div class="actions">
      <button class="secondary" onclick="openProfile()">👤 Mon Profil</button>
      <button id="buyButton" onclick="buyVehicle()">Acheter véhicule unique</button>
      <button class="secondary" onclick="storeVehicle()">Ranger mon véhicule actuel</button>
      <button class="secondary" onclick="recoverFleet()">Récupérer bloqués</button>
    </div>

    <div class="list" id="vehicles"></div>
    <div class="footer" id="footerTxt">—</div>

    <div id="profileModal">
        <div class="profile-card">
            <h3>Fiche Employé</h3>
            <div id="profileContent">Chargement...</div>
            <br>
            <button style="width:100%" onclick="closeProfile()">Retour</button>
        </div>
    </div>
  </section>

  <script>
    const resource = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'bs_taxi_job';
    let fleet = [];

    function normalizeFleet(input) {
      if (!input) return [];
      if (Array.isArray(input)) return input;
      if (typeof input === 'object') return Object.values(input);
      return [];
    }

    function post(action, data = {}) {
      return fetch(`https://${resource}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data)
      });
    }

    function closeTablet() {
      document.body.style.display = 'none';
      post('close');
    }

    function logout() {
        document.body.style.display = 'none';
        post('logout');
    }

    function openProfile() {
        document.getElementById('profileModal').style.display = 'flex';
        post('getProfileData').then(res => res.json()).then(data => {
            const root = document.getElementById('profileContent');
            if (data && data.citizenid) {
                root.innerHTML = `
                    <div class="profile-item"><span>Nom Complet:</span> <span>${data.name}</span></div>
                    <div class="profile-item"><span>ID Citoyen:</span> <span>${data.citizenid}</span></div>
                    <div class="profile-item"><span>Grade:</span> <span>${data.jobGrade}</span></div>
                    <div class="profile-item"><span>Salaire:</span> <span>${data.salary}$</span></div>
                    <hr style="border:0; border-top:1px solid #333;">
                    <div class="profile-item"><span>Cash:</span> <span style="color:#4caf50">${data.cash}$</span></div>
                    <div class="profile-item"><span>Banque:</span> <span style="color:#2196f3">${data.bank}$</span></div>
                `;
            } else {
                root.innerHTML = "Erreur lors de la récupération des données.";
            }
        });
    }

    function closeProfile() {
        document.getElementById('profileModal').style.display = 'none';
    }

    function buyVehicle() {
      post('buyUniqueVehicle');
    }

    function storeVehicle() {
      post('storeCurrentVehicle');
    }

    function recoverFleet() {
      post('recoverFleet');
    }

    function spawn(id) {
      post('spawnVehicle', { id });
    }

    function forceRecover(id) {
      post('forceRecoverVehicle', { id });
    }

    function renderVehicles() {
      const root = document.getElementById('vehicles');
      root.innerHTML = '';

      if (!fleet.length) {
        root.innerHTML = '<div class="card">Aucun véhicule entreprise pour le moment.</div>';
        return;
      }

      fleet.forEach(v => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="row"><span class="plate">${v.plate}</span><span>${v.model.toUpperCase()}</span></div>
          <div class="row muted"><span>État restant: <strong>${v.remaining}%</strong></span><span>Essence: <strong>${v.fuel}%</strong></span></div>
          <div class="row muted"><span>Moteur: ${Math.floor(v.engine)}</span><span>Carrosserie: ${Math.floor(v.body)}</span></div>
          <div class="row"><span>${v.stored ? '🅿️ Garé' : '🚕 En circulation'}</span>
            ${v.stored
              ? `<button onclick="spawn(${v.id})">Sortir</button>`
              : `<button class="secondary" onclick="forceRecover(${v.id})">Forcer retour</button>`
            }
          </div>
        `;
        root.appendChild(div);
      });
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data.action !== 'open') return;

      const payload = data.payload || {};
      fleet = normalizeFleet(payload.vehicles);
      document.body.style.display = 'block';

      if (payload.theme) {
        document.documentElement.style.setProperty('--primary', payload.theme.primary || '#ffcc00');
        document.documentElement.style.setProperty('--secondary', payload.theme.secondary || '#f7d84b');
        document.documentElement.style.setProperty('--dark', payload.theme.dark || '#121212');
      }

      document.getElementById('footerTxt').textContent = `Véhicule unique: ${payload.uniqueModel || 'taxi'} — Prix achat: ${payload.price || 0}$`;
      renderVehicles();
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Escape') closeTablet();
    });
  </script>
</body>
</html>
